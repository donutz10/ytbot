services:
  bot:
    build: .
    # or, after the GitHub Action has run once:
    # image: ghcr.io/YOUR_GITHUB_USERNAME/yt-music-bot:latest
    env_file: .env
    environment:
      # yt-dlp asks this sidecar for YouTube "PO tokens"; needed on cloud/datacenter IPs alongside cookies
      POT_PROVIDER_URL: http://bgutil:4416
      # the system binaries from the image, even if .env has empty FFMPEG_PATH= / YTDLP_PATH= lines
      # (the npm ffmpeg-static build cannot fetch from YouTube's media servers)
      FFMPEG_PATH: /usr/bin/ffmpeg
      YTDLP_PATH: /usr/local/bin/yt-dlp
    restart: unless-stopped
    depends_on:
      - bgutil
    volumes:
      - ./cookies.txt:/app/cookies.txt   # optional, remove if unused. Writable: yt-dlp saves refreshed cookies back

  # PO-token generator (https://github.com/Brainicism/bgutil-ytdlp-pot-provider). Not exposed outside Docker.
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider
    init: true
    restart: unless-stopped
